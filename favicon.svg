<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Gradiente da fruta: amarelo (esq) → laranja (dir) com leve diagonal -->
    <linearGradient id="mng-fruit" x1="0.05" y1="0.3" x2="0.95" y2="0.7">
      <stop offset="0%"   stop-color="#FFD55C"/>
      <stop offset="35%"  stop-color="#FFB833"/>
      <stop offset="65%"  stop-color="#FA8228"/>
      <stop offset="100%" stop-color="#E76318"/>
    </linearGradient>
    <linearGradient id="mng-leaf" x1="0.2" y1="1" x2="0.85" y2="0">
      <stop offset="0%"   stop-color="#3A8A3A"/>
      <stop offset="100%" stop-color="#5FB350"/>
    </linearGradient>
  </defs>
  <!-- Talo verde-marrom -->
  <path d="M 30 17 Q 30 13 28 10" stroke="#3D6A2A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Folha (top-left, curvada) -->
  <path d="M 26 13 C 16 6, 8 11, 11 18 C 15 24, 25 21, 30 14 Z" fill="url(#mng-leaf)"/>
  <!-- Nervura central da folha -->
  <path d="M 12 16 Q 21 16, 28 14" stroke="#2D6E2D" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Corpo da fruta (oval, ligeiramente alongada) -->
  <ellipse cx="32" cy="40" rx="22" ry="21" fill="url(#mng-fruit)"/>
  <!-- Brilho suave canto superior esquerdo -->
  <ellipse cx="22" cy="30" rx="7" ry="4.5" fill="#FFFFFF" opacity="0.42" transform="rotate(-15 22 30)"/>
</svg>
